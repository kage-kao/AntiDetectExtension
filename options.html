<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AntiDetectExtension — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <img src="icons/icon128.png" alt="" class="logo">
        <div>
          <h1 data-i18n="settings">Настройки</h1>
          <p class="sub" data-i18n="desc_settings"></p>
        </div>
      </div>
      <div class="top-right">
        <span id="saveState" class="save-state" data-testid="opt-save-state" aria-live="polite"></span>
        <select id="lang" class="lang" data-testid="opt-lang-select">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <section class="card">
      <div class="row"><span data-i18n="master">Защита включена</span><label class="switch"><input type="checkbox" id="enabled" data-testid="opt-enabled"><span class="slider"></span></label></div>
      <div class="row"><span data-i18n="forget_sites">Забывать сайты после закрытия</span><label class="switch"><input type="checkbox" id="forgetSites" data-testid="opt-forget"><span class="slider"></span></label></div>
      <p class="hint" data-i18n="forget_hint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="identity">Образ</h2>
      <div class="profile-box" data-testid="opt-profile-box">
        <div class="profile-name" id="profileName" data-testid="opt-profile-name">—</div>
        <div class="profile-meta" id="profileMeta" data-testid="opt-profile-meta">—</div>
        <div class="profile-actions">
          <label class="fld-inline"><span data-i18n="country">Страна</span>
            <select id="country" class="lang" data-testid="opt-country-select"></select>
          </label>
          <label class="fld-inline"><span data-i18n="os">Система</span>
            <select id="os" class="lang" data-testid="opt-os-select">
              <option value="win">Windows</option>
              <option value="mac">macOS</option>
              <option value="linux">Linux</option>
            </select>
          </label>
        </div>
        <div class="profile-actions">
          <select id="mode" class="lang" data-testid="opt-mode-select">
            <option value="stable" data-i18n="profile_stable">Стабильный образ</option>
            <option value="per-visit" data-i18n="profile_pervisit">Случайный каждый визит</option>
          </select>
          <button id="newIdentity" class="btn" data-testid="opt-new-identity" data-i18n="new_identity">Новый образ</button>
        </div>
        <p class="hint" data-i18n="profile_hint_stable"></p>
        <p class="hint warn" data-i18n="proxy_reminder"></p>
      </div>
    </section>

    <div class="dependent">
      <section class="card">
        <h2 data-i18n="network">Блокировка сети</h2>
        <div class="row"><span data-i18n="block_ads">Реклама</span><label class="switch"><input type="checkbox" id="blockAds" data-testid="opt-ads"><span class="slider"></span></label></div>
        <div class="row"><span data-i18n="block_trackers">Трекеры</span><label class="switch"><input type="checkbox" id="blockTrackers" data-testid="opt-trackers"><span class="slider"></span></label></div>
        <div class="row"><span data-i18n="cosmetic">Скрывать рекламу</span><label class="switch"><input type="checkbox" id="cosmetic" data-testid="opt-cosmetic"><span class="slider"></span></label></div>
      </section>

      <section class="card">
        <h2 data-i18n="protection_groups">Группы защиты отпечатка</h2>
        <div class="groups" id="groups"></div>
      </section>
    </div>

    <section class="card">
      <h2 data-i18n="user_rules">Свои правила</h2>
      <label class="fld" data-i18n="block_domains">Блокировать домены</label>
      <textarea id="userBlockDomains" data-testid="opt-block-domains" placeholder="example-ads.com"></textarea>
      <label class="fld" data-i18n="hide_selectors">Скрывать по CSS-селектору</label>
      <textarea id="userHideSelectors" data-testid="opt-hide-selectors" placeholder=".banner-ad"></textarea>
      <label class="fld" data-i18n="whitelist">Белый список сайтов</label>
      <textarea id="whitelist" data-testid="opt-whitelist" placeholder="bank.com"></textarea>
    </section>

    <section class="card">
      <h2 data-i18n="selftest">Проверка отпечатка</h2>
      <button id="openSelftest" class="btn" data-testid="opt-open-selftest" data-i18n="open_selftest">Открыть проверку отпечатка</button>
    </section>

    <p class="note" data-i18n="note"></p>
  </div>
  <div id="toast" class="toast" data-testid="opt-toast" role="alert"></div>
  <script src="common.js"></script>
  <script src="profiles.js"></script>
  <script src="i18n.js"></script>
  <script src="ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
